<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor Diário - Premium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-body: #eaeaec;
            --bg-card: #ffffff;
            --bg-card-alt: #f5f5f7;
            --text-main: #111111;
            --text-muted: #8e8e93;
            --accent-orange: #ff5e3a;
            --nav-bg: #2c2c2e;
            --progress-track: #ffffff;
            --progress-fill: #3a3a3c;
            --red-delete: #ff3b30;
        }

        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 30px 20px 120px 20px; max-width: 500px; margin: 0 auto;
            background-color: var(--bg-body); color: var(--text-main); -webkit-font-smoothing: antialiased;
        }
        button, input { font-family: inherit; }

        .view-page { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .view-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .view-page { animation: none; } }

        .header-title { font-size: 38px; font-weight: 800; line-height: 1.1; margin: 20px 0 35px 0; text-align: center; letter-spacing: -1.5px; }
        .header-title span { color: var(--text-muted); font-size: 28px; font-weight: 600; display: block; margin-top: 5px; letter-spacing: -1px; }

        .hero-card { background: var(--bg-card-alt); border-radius: 32px; padding: 25px; position: relative; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .hero-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
        .hero-value { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 25px; display: block; font-variant-numeric: tabular-nums; }
        .hero-btn {
            position: absolute; right: 25px; top: 25px; width: 50px; height: 50px; border-radius: 50%; padding: 0;
            background: var(--accent-orange); color: white; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(255, 94, 58, 0.3); transition: transform 0.2s, background 0.3s;
        }
        .hero-btn:active { transform: scale(0.9); }
        .hero-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .progress-track { background: var(--progress-track); height: 16px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.04); }
        .progress-fill { background: var(--progress-fill); height: 100%; border-radius: 8px; width: 0%; transition: width 1s ease-in-out; }
        .progress-labels { display: flex; justify-content: flex-end; font-size: 13px; font-weight: 800; margin-top: 10px; }
        .progress-labels span { color: var(--text-muted); margin-right: 2px; }

        .quick-actions { display: flex; justify-content: space-between; margin-bottom: 35px; padding: 0 5px; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: transform 0.2s; }
        .action-item:active { transform: scale(0.95); }
        .action-circle { width: 65px; height: 65px; background: var(--bg-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 25px rgba(0,0,0,0.05); color: var(--text-main); }
        .action-label { font-size: 12px; font-weight: 700; color: var(--text-muted); }

        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.5px; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .summary-card { background: var(--bg-card); border-radius: 32px; padding: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 100px; cursor: pointer; }
        .summary-label { font-size: 13px; font-weight: 600; color: var(--text-muted); line-height: 1.25; }
        .summary-value { font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
        .summary-value svg { color: var(--accent-orange); }

        .list-card { background: var(--bg-card); border-radius: 28px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); overflow: hidden; position: relative; touch-action: pan-y; }
        .swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; width: 80px; display: flex; align-items: center; justify-content: flex-end; padding-right: 15px; }
        .btn-delete-swipe { background: var(--red-delete); color: white; border-radius: 50%; width: 50px; height: 50px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 5px 15px rgba(255, 59, 48, 0.3); }
        .swipe-content { display: flex; justify-content: space-between; align-items: center; padding: 22px; background: var(--bg-card); position: relative; z-index: 2; width: 100%; box-sizing: border-box; }
        .item-info { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; padding-right: 15px; cursor: pointer; }
        .item-data { font-size: 12px; color: var(--accent-orange); font-weight: 800; }
        .item-data.univ { color: #007aff; }
        .item-titulo { font-size: 17px; font-weight: 700; }
        .item-notas { font-size: 14px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .swipe-content.concluido .item-titulo, .swipe-content.concluido .item-notas { text-decoration: line-through; color: #c7c7cc; }
        .empty { color: var(--text-muted); font-size: 14px; font-weight: 500; }

        input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #e5e5ea; background: #fff; position: relative; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; margin: 0; }
        input[type="checkbox"]:checked { background: var(--accent-orange); border-color: var(--accent-orange); }
        input[type="checkbox"].check-univ:checked { background: #007aff; border-color: #007aff; }
        input[type="checkbox"]:checked::after { content: ''; position: absolute; left: 10px; top: 6px; width: 6px; height: 12px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

        .nav-container { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .nav-bar { background: var(--nav-bg); border-radius: 50px; padding: 6px; display: flex; gap: 5px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); pointer-events: auto; }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 40px; color: #8e8e93; cursor: pointer; transition: all 0.3s ease; }
        .nav-item.active { background: #ffffff; color: var(--accent-orange); }
        .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item span { font-size: 14px; font-weight: 800; display: none; }
        .nav-item.active span { display: block; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 2000; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-bottom { position: fixed; bottom: -100%; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: var(--bg-card); border-radius: 40px 40px 0 0; padding: 35px 25px 50px 25px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2001; box-sizing: border-box; max-height: 85vh; overflow-y: auto; }
        .modal-bottom.active { bottom: 0; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .modal-close { background: #f2f2f7; border: none; border-radius: 50%; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; cursor: pointer; color: #000; }

        input[type="text"], input[type="date"] { background: #f2f2f7; color: var(--text-main); border: none; padding: 18px 22px; border-radius: 25px; margin-bottom: 15px; width: 100%; box-sizing: border-box; font-size: 16px; font-weight: 600; -webkit-appearance: none; appearance: none; }
        input:focus { outline: none; background: #fff; box-shadow: 0 0 0 2px var(--accent-orange), 0 10px 20px rgba(255, 94, 58, 0.1); }
        input::placeholder { color: #a0a0a5; font-weight: 500; }

        .btn-submit { background: var(--accent-orange); color: white; border: none; border-radius: 30px; padding: 18px; width: 100%; font-size: 16px; font-weight: 800; box-shadow: 0 10px 25px rgba(255, 94, 58, 0.3); cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        .btn-submit:active { transform: scale(0.97); }
        .btn-submit.univ { background: #007aff; box-shadow: 0 10px 25px rgba(0, 122, 255, 0.3); }
        .btn-link { background: transparent; border: none; color: var(--accent-orange); font-weight: 700; font-size: 15px; padding: 0; text-align: left; margin-bottom: 15px; cursor: pointer; }

        .history-item { display: flex; justify-content: space-between; gap: 12px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
        .history-item:last-child { border-bottom: none; }
        button:focus-visible, .nav-item:focus-visible, .action-item:focus-visible { outline: 3px solid var(--text-main); outline-offset: 2px; }
    </style>
</head>
<body>

    <!-- DASHBOARD -->
    <div id="view-home" class="view-page active">
        <h1 class="header-title" id="tituloData">A carregar...</h1>

        <div class="hero-card">
            <div class="hero-title">Estado do Jejum</div>
            <span class="hero-value" id="cronometro">00:00:00</span>
            <button class="hero-btn" onclick="toggleJejum()" id="btnJejum" aria-label="Iniciar ou terminar jejum">
                <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </button>
            <div class="progress-container">
                <div class="progress-track"><div class="progress-fill" id="barraJejum"></div></div>
                <div class="progress-labels"><span id="percentagemJejum">0</span>/16h</div>
            </div>
        </div>

        <div class="quick-actions">
            <div class="action-item" tabindex="0" onclick="abrirModal('modalTreino')">
                <div class="action-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9v6M6.5 6v12M17.5 6v12M21 9v6M6.5 12h11"/></svg></div>
                <span class="action-label">Treino</span>
            </div>
            <div class="action-item" tabindex="0" onclick="abrirModal('modalRefeicao')">
                <div class="action-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg></div>
                <span class="action-label">Refeição</span>
            </div>
            <div class="action-item" tabindex="0" onclick="abrirModal('modalTarefa')">
                <div class="action-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c3 2.5 9 2.5 12 0v-4.5"/></svg></div>
                <span class="action-label">Estudo</span>
            </div>
            <div class="action-item" tabindex="0" onclick="listarHistoricoJejum()">
                <div class="action-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
                <span class="action-label">Histórico</span>
            </div>
        </div>

        <h2 class="section-title">Resumo Diário</h2>
        <div class="summary-grid">
            <div class="summary-card" onclick="listarDatasRefeicoes()">
                <span class="summary-label">Refeições registadas hoje</span>
                <div class="summary-value"><span id="resumoRefeicoes">0</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>
                </div>
            </div>
            <div class="summary-card" onclick="mudarAba('week')">
                <span class="summary-label">Tarefas pendentes</span>
                <div class="summary-value"><span id="resumoTarefas">0</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- A MINHA SEMANA -->
    <div id="view-week" class="view-page">
        <h1 class="header-title" style="margin-bottom: 25px;">A Minha<br>Semana</h1>
        <h2 class="section-title" style="margin-top: 20px;">Treinos Agendados</h2>
        <div id="listaTreinos"></div>
        <h2 class="section-title" style="margin-top: 35px;">Mestrado (Tarefas)</h2>
        <div id="listaTarefas"></div>
    </div>

    <!-- MODAIS -->
    <div class="modal-overlay" id="modalOverlay" onclick="fecharTodosModais()"></div>

    <div class="modal-bottom" id="modalTreino">
        <div class="modal-header"><div class="modal-title">Novo Treino</div><button class="modal-close" onclick="fecharTodosModais()" aria-label="Fechar">✕</button></div>
        <input type="text" id="tituloTreino" placeholder="Título (Ex: Upper Body)">
        <input type="text" id="descTreino" placeholder="Exercícios...">
        <input type="date" id="dataTreino">
        <button class="btn-submit" onclick="agendarTreino()">Agendar Treino</button>
    </div>

    <div class="modal-bottom" id="modalRefeicao">
        <div class="modal-header"><div class="modal-title">Registar Refeição</div><button class="modal-close" onclick="fecharTodosModais()" aria-label="Fechar">✕</button></div>
        <input type="text" id="refeicaoInput" placeholder="O que comeste?">
        <input type="text" id="notasInput" placeholder="Notas (Opcional)">
        <button class="btn-submit" onclick="registarRefeicao()">Gravar Refeição</button>
    </div>

    <div class="modal-bottom" id="modalTarefa">
        <div class="modal-header"><div class="modal-title">Nova Tarefa</div><button class="modal-close" onclick="fecharTodosModais()" aria-label="Fechar">✕</button></div>
        <input type="text" id="cadeiraInput" placeholder="Cadeira (Ex: Automação)">
        <input type="text" id="descTarefaInput" placeholder="O que tens de fazer?">
        <input type="date" id="dataLimiteInput">
        <button class="btn-submit univ" onclick="adicionarTarefa()">Adicionar Tarefa</button>
    </div>

    <div class="modal-bottom" id="modalHistorico">
        <div class="modal-header"><div class="modal-title" id="tituloHistorico">Histórico</div><button class="modal-close" onclick="fecharTodosModais()" aria-label="Fechar">✕</button></div>
        <div id="conteudoHistorico"></div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav-container">
        <div class="nav-bar">
            <div class="nav-item active" id="tab-home" onclick="mudarAba('home')">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                <span>Diário</span>
            </div>
            <div class="nav-item" id="tab-week" onclick="mudarAba('week')">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Semana</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://192.168.1.72:8000/api";
        let refeicoesGlobais = [];
        let treinosGlobais = [];
        let tarefasGlobais = [];
        let estadoJejumAtivo = false;

        const iconeLixo = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>`;

        // Escapa texto vindo da API antes de o pôr em HTML
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function dataCurta(d) { const p = d.split('-'); return p[2] + '/' + p[1]; }
        async function api(path, options) {
            try {
                const res = await fetch(`${API_BASE}${path}`, options);
                if (!res.ok) throw new Error(res.status);
                return res;
            } catch (e) {
                alert("Não foi possível ligar ao servidor. Verifica a rede e tenta de novo.");
                throw e;
            }
        }
        const jsonHeaders = { "Content-Type": "application/json" };

        function definirDataCabecalho() {
            const data = new Date();
            const dias = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
            const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            document.getElementById("tituloData").innerHTML = `${data.getDate()} de ${meses[data.getMonth()]}<br><span>${dias[data.getDay()]}</span>`;
        }

        // ==========================
        // NAVEGAÇÃO
        // ==========================
        function mudarAba(aba) {
            document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + aba).classList.add('active');
            document.getElementById('tab-' + aba).classList.add('active');
            if (aba === 'week') { listarTreinos(); listarTarefas(); }
            else atualizarResumos();
            window.scrollTo(0, 0);
        }

        // ==========================
        // MODAIS
        // ==========================
        function abrirModal(id) {
            document.getElementById('modalOverlay').classList.add('active');
            document.querySelectorAll('.modal-bottom').forEach(m => m.classList.toggle('active', m.id === id));
        }
        function fecharTodosModais() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.querySelectorAll('.modal-bottom').forEach(m => m.classList.remove('active'));
        }
        function abrirModalHistorico(titulo, html) {
            document.getElementById('tituloHistorico').innerText = titulo;
            document.getElementById('conteudoHistorico').innerHTML = html || "<p class='empty'>Sem dados.</p>";
            abrirModal('modalHistorico');
        }

        // ==========================
        // SWIPE TO DELETE
        // ==========================
        let startX = 0, currentX = 0, swipedElement = null;

        function handleSwipeStart(e) {
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            currentX = startX; swipedElement = e.currentTarget; swipedElement.style.transition = 'none';
            document.querySelectorAll('.swipe-content').forEach(el => {
                if (el !== swipedElement && el.classList.contains('open')) { el.style.transform = 'translateX(0)'; el.classList.remove('open'); }
            });
        }
        function handleSwipeMove(e) {
            if (!swipedElement) return;
            currentX = e.type === 'touchmove' ? e.touches[0].clientX : (e.buttons === 1 ? e.clientX : currentX);
            const diffX = currentX - startX;
            if (diffX < 0 && diffX >= -80) swipedElement.style.transform = `translateX(${diffX}px)`;
        }
        function handleSwipeEnd() {
            if (!swipedElement) return;
            const diffX = currentX - startX;
            swipedElement.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
            if (diffX < -35) { swipedElement.style.transform = 'translateX(-70px)'; swipedElement.classList.add('open'); }
            else { swipedElement.style.transform = 'translateX(0)'; swipedElement.classList.remove('open'); }
            swipedElement = null;
        }
        const swipeAttrs = `ontouchstart="handleSwipeStart(event)" ontouchmove="handleSwipeMove(event)" ontouchend="handleSwipeEnd(event)" onmousedown="handleSwipeStart(event)" onmousemove="handleSwipeMove(event)" onmouseup="handleSwipeEnd(event)" onmouseleave="handleSwipeEnd(event)"`;

        // ==========================
        // JEJUM
        // ==========================
        let intervaloCronometro;
        function atualizarCronometro(dataInicio) {
            const diferenca = new Date().getTime() - new Date(dataInicio).getTime();
            if (diferenca < 0) return;
            const horasTotais = diferenca / 3600000;
            const h = String(Math.floor(horasTotais)).padStart(2, '0');
            const m = String(Math.floor((diferenca % 3600000) / 60000)).padStart(2, '0');
            const s = String(Math.floor((diferenca % 60000) / 1000)).padStart(2, '0');
            document.getElementById("cronometro").innerText = `${h}:${m}:${s}`;
            const percentagem = Math.min(100, (horasTotais / 16) * 100);
            document.getElementById("barraJejum").style.width = `${percentagem}%`;
            document.getElementById("percentagemJejum").innerText = Math.floor(horasTotais);
        }
        function iniciarContagem(data) {
            estadoJejumAtivo = true;
            document.getElementById('btnJejum').style.background = '#3a3a3c';
            clearInterval(intervaloCronometro); atualizarCronometro(data);
            intervaloCronometro = setInterval(() => atualizarCronometro(data), 1000);
        }
        function pararContagem() {
            estadoJejumAtivo = false;
            document.getElementById('btnJejum').style.background = 'var(--accent-orange)';
            clearInterval(intervaloCronometro);
            document.getElementById("cronometro").innerText = "00:00:00";
            document.getElementById("barraJejum").style.width = "0%";
            document.getElementById("percentagemJejum").innerText = "0";
        }
        async function verificarJejumAtivo() {
            try {
                const res = await fetch(`${API_BASE}/fitness/jejum/historico`);
                const hist = await res.json();
                if (hist.length > 0 && hist[0].fim === null) iniciarContagem(hist[0].inicio);
                else pararContagem();
            } catch (e) {}
        }
        async function toggleJejum() {
            if (estadoJejumAtivo) {
                await api('/fitness/jejum/terminar', { method: "POST" });
                pararContagem();
            } else {
                const res = await api('/fitness/jejum/iniciar', { method: "POST" });
                const data = await res.json();
                if (data.hora_inicio) iniciarContagem(data.hora_inicio);
            }
        }
        async function listarHistoricoJejum() {
            const res = await api('/fitness/jejum/historico');
            const historico = await res.json();
            let html = "";
            historico.forEach(r => {
                const dataBonita = new Date(r.inicio).toLocaleDateString('pt-PT');
                const valor = r.duracao_horas !== null ? `${esc(r.duracao_horas)}h de jejum` : "Em progresso...";
                html += `<div class="history-item"><span style="font-weight:700;">${dataBonita}</span><span style="color:var(--text-muted);">${valor}</span></div>`;
            });
            abrirModalHistorico("Histórico de Jejum", html);
        }

        // ==========================
        // ALIMENTAÇÃO E RESUMOS
        // ==========================
        async function registarRefeicao() {
            const refeicao = document.getElementById("refeicaoInput").value.trim();
            if (!refeicao) return alert("Insere a refeição.");
            await api('/fitness/alimentacao', {
                method: "POST", headers: jsonHeaders,
                body: JSON.stringify({ refeicao, notas: document.getElementById("notasInput").value })
            });
            document.getElementById("refeicaoInput").value = ""; document.getElementById("notasInput").value = "";
            fecharTodosModais(); atualizarResumos();
        }

        const fmtDia = d => new Date(d).toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });

        async function listarDatasRefeicoes() {
            const res = await api('/fitness/alimentacao');
            refeicoesGlobais = await res.json();
            const diasAgrupados = {};
            refeicoesGlobais.forEach(r => { (diasAgrupados[fmtDia(r.data_hora)] ||= []).push(r); });
            let html = "";
            Object.keys(diasAgrupados).forEach((dia, i) => {
                html += `<div class="history-item" style="cursor:pointer;" data-dia="${esc(dia)}" onclick="verRefeicoesDoDia(this.dataset.dia)">
                            <span style="font-weight:700;">${esc(dia)}</span><span style="color:var(--text-muted);">${diasAgrupados[dia].length} ref. ›</span>
                         </div>`;
            });
            abrirModalHistorico("Diário Alimentar", html);
        }

        function verRefeicoesDoDia(diaStr) {
            const refsDoDia = refeicoesGlobais.filter(r => fmtDia(r.data_hora) === diaStr);
            let html = `<button class="btn-link" onclick="listarDatasRefeicoes()">‹ Voltar</button>`;
            refsDoDia.forEach(r => {
                const hora = new Date(r.data_hora).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
                html += `<div class="history-item" style="flex-direction:column; gap:5px;">
                            <div style="display:flex; justify-content:space-between; gap:12px;"><span style="font-weight:700;">${hora}</span><span>${esc(r.refeicao)}</span></div>
                            ${r.notas ? `<span style="font-size:13px; color:var(--text-muted);">${esc(r.notas)}</span>` : ''}
                         </div>`;
            });
            document.getElementById('tituloHistorico').innerText = diaStr;
            document.getElementById('conteudoHistorico').innerHTML = html;
        }

        async function atualizarResumos() {
            try {
                const [resT, resR] = await Promise.all([fetch(`${API_BASE}/universidade/tarefas`), fetch(`${API_BASE}/fitness/alimentacao`)]);
                const tarefas = await resT.json();
                const refeicoes = await resR.json();
                document.getElementById('resumoTarefas').innerText = tarefas.filter(t => !t.concluido).length;
                const hoje = new Date().toLocaleDateString('pt-PT');
                document.getElementById('resumoRefeicoes').innerText = refeicoes.filter(r => new Date(r.data_hora).toLocaleDateString('pt-PT') === hoje).length;
            } catch (e) {}
        }

        // ==========================
        // TREINOS E TAREFAS
        // ==========================
        async function agendarTreino() {
            const titulo = document.getElementById("tituloTreino").value.trim();
            const data = document.getElementById("dataTreino").value;
            if (!titulo || !data) return alert("Título e Data são obrigatórios.");
            await api('/fitness/treinos', {
                method: "POST", headers: jsonHeaders,
                body: JSON.stringify({ titulo, descricao: document.getElementById("descTreino").value, data_agendada: data })
            });
            document.getElementById("tituloTreino").value = ""; document.getElementById("descTreino").value = "";
            fecharTodosModais(); listarTreinos();
        }
        async function concluirTreino(id) { await api(`/fitness/treinos/${id}/concluir`, { method: "PUT" }); listarTreinos(); }
        async function apagarTreino(id) { await api(`/fitness/treinos/${id}`, { method: "DELETE" }); listarTreinos(); }

        async function adicionarTarefa() {
            const cadeira = document.getElementById("cadeiraInput").value.trim();
            const desc = document.getElementById("descTarefaInput").value.trim();
            const data = document.getElementById("dataLimiteInput").value;
            if (!cadeira || !desc || !data) return alert("Preenche todos os campos.");
            await api('/universidade/tarefas', {
                method: "POST", headers: jsonHeaders,
                body: JSON.stringify({ cadeira, descricao: desc, data_limite: data })
            });
            document.getElementById("cadeiraInput").value = ""; document.getElementById("descTarefaInput").value = "";
            fecharTodosModais(); listarTarefas(); atualizarResumos();
        }
        async function concluirTarefa(id) { await api(`/universidade/tarefas/${id}/concluir`, { method: "PUT" }); listarTarefas(); atualizarResumos(); }
        async function apagarTarefa(id) { await api(`/universidade/tarefas/${id}`, { method: "DELETE" }); listarTarefas(); atualizarResumos(); }

        function verTreino(id) {
            const t = treinosGlobais.find(x => x.id === id);
            if (t) abrirModalHistorico(t.titulo, `<p style="font-size:16px; line-height:1.5;">${esc(t.descricao) || 'Sem descrição.'}</p>`);
        }
        function verTarefa(id) {
            const t = tarefasGlobais.find(x => x.id === id);
            if (t) abrirModalHistorico(t.cadeira, `<p style="font-size:16px; line-height:1.5;">${esc(t.descricao) || 'Sem descrição.'}</p>`);
        }

        async function listarTreinos() {
            try {
                const res = await fetch(`${API_BASE}/fitness/treinos`);
                treinosGlobais = await res.json();
            } catch (e) { return; }
            const divLista = document.getElementById("listaTreinos");
            if (treinosGlobais.length === 0) { divLista.innerHTML = "<p class='empty'>Sem treinos agendados. Toca em Treino no Diário para criar um.</p>"; return; }
            divLista.innerHTML = treinosGlobais.map(t => `
                <div class="list-card">
                    <div class="swipe-actions"><button class="btn-delete-swipe" aria-label="Apagar" onclick="apagarTreino(${t.id})">${iconeLixo}</button></div>
                    <div class="swipe-content ${t.concluido ? 'concluido' : ''}" ${swipeAttrs}>
                        <div class="item-info" onclick="verTreino(${t.id})">
                            <span class="item-data">${dataCurta(t.data_agendada)}</span>
                            <span class="item-titulo">${esc(t.titulo)}</span>
                        </div>
                        <input type="checkbox" ${t.concluido ? 'checked' : ''} onclick="concluirTreino(${t.id})">
                    </div>
                </div>`).join('');
        }

        async function listarTarefas() {
            try {
                const res = await fetch(`${API_BASE}/universidade/tarefas`);
                tarefasGlobais = await res.json();
            } catch (e) { return; }
            const divLista = document.getElementById("listaTarefas");
            if (tarefasGlobais.length === 0) { divLista.innerHTML = "<p class='empty'>Tudo em dia!</p>"; return; }
            divLista.innerHTML = tarefasGlobais.map(t => `
                <div class="list-card">
                    <div class="swipe-actions"><button class="btn-delete-swipe" aria-label="Apagar" onclick="apagarTarefa(${t.id})">${iconeLixo}</button></div>
                    <div class="swipe-content ${t.concluido ? 'concluido' : ''}" ${swipeAttrs}>
                        <div class="item-info" onclick="verTarefa(${t.id})">
                            <span class="item-data univ">Para entregar: ${dataCurta(t.data_limite)}</span>
                            <span class="item-titulo">${esc(t.cadeira)}</span>
                            <span class="item-notas">${esc(t.descricao)}</span>
                        </div>
                        <input type="checkbox" class="check-univ" ${t.concluido ? 'checked' : ''} onclick="concluirTarefa(${t.id})">
                    </div>
                </div>`).join('');
        }

        window.onload = function() {
            definirDataCabecalho();
            verificarJejumAtivo();
            atualizarResumos();
        };
    </script>
</body>
</html>
